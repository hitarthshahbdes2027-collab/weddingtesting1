<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fefcd6"><title>Tanuj & Nishtha · The invitation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main aria-label="Tanuj and Nishtha wedding invitation">
 <div id="viewport"><div id="book" tabindex="0" role="group" aria-label="Invitation flipbook. Drag a page corner, swipe, or use the arrow keys."></div></div>
 <nav class="controls" aria-label="Invitation pages"><button id="prev" aria-label="Previous page" disabled>‹</button><span id="count" role="status" aria-live="polite">1 / 9</span><button id="next" aria-label="Next page">›</button><button id="expand" aria-label="Enlarge current card" title="Enlarge card">⤢</button></nav>
 <p id="error" role="alert" hidden></p>
</main>
<dialog id="detail"><button id="close" aria-label="Close enlarged card">×</button><img id="detail-image" alt=""></dialog>
<script src="vendor/page-flip.browser.js"></script><script src="app.js"></script>
</body></html>
